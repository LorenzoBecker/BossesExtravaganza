name: Foundry Environment Cache Bootstrap

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ foundry-toolchain-bootstrap-20260722 ]

permissions:
  contents: read

jobs:
  prepare-cache:
    runs-on: ubuntu-latest
    env:
      DOTNET_NOLOGO: '1'
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'
      NUGET_PACKAGES: ${{ github.workspace }}/nuget-cache
    steps:
      - name: Select exact SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.301'

      - name: Create isolated Avalonia probe
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p probe
          cat > global.json <<'JSON'
          {
            "sdk": {
              "version": "10.0.301",
              "rollForward": "disable",
              "allowPrerelease": false
            }
          }
          JSON
          cat > probe/FoundryEnvironmentProbe.csproj <<'XML'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <OutputType>Exe</OutputType>
              <TargetFramework>net10.0</TargetFramework>
              <RuntimeIdentifiers>linux-x64;win-x64</RuntimeIdentifiers>
              <RestorePackagesWithLockFile>true</RestorePackagesWithLockFile>
              <TreatWarningsAsErrors>true</TreatWarningsAsErrors>
              <LangVersion>14.0</LangVersion>
              <Deterministic>true</Deterministic>
            </PropertyGroup>
            <ItemGroup>
              <PackageReference Include="Avalonia" Version="12.1.0" />
              <PackageReference Include="Avalonia.Desktop" Version="12.1.0" />
              <PackageReference Include="Avalonia.Fonts.Inter" Version="12.1.0" />
              <PackageReference Include="Avalonia.Headless" Version="12.1.0" />
              <PackageReference Include="Avalonia.Skia" Version="12.1.0" />
              <PackageReference Include="Avalonia.Themes.Fluent" Version="12.1.0" />
              <PackageReference Include="HarfBuzzSharp" Version="8.3.1.3" />
              <PackageReference Include="SkiaSharp" Version="3.119.4" />
            </ItemGroup>
          </Project>
          XML
          cat > probe/Program.cs <<'CS'
          using Avalonia;
          using Avalonia.Headless;
          using SkiaSharp;

          ProbeApp.BuildAvaloniaApp().SetupWithoutStarting();

          using var surface = SKSurface.Create(new SKImageInfo(420, 140, SKColorType.Bgra8888, SKAlphaType.Premul));
          if (surface is null)
              throw new InvalidOperationException("SKSurface creation failed.");

          var canvas = surface.Canvas;
          canvas.Clear(SKColors.White);
          using var typeface = SKFontManager.Default.MatchCharacter("Mandate UI Foundry — 10.0.301", Array.Empty<string>(), SKFontStyle.Normal, 'M');
          if (typeface is null)
              throw new InvalidOperationException("Font resolution failed.");

          using var font = new SKFont(typeface, 28);
          using var paint = new SKPaint { Color = SKColors.Black, IsAntialias = true };
          canvas.DrawText("Mandate UI Foundry — Avalonia 12.1.0", 12, 78, SKTextAlign.Left, font, paint);
          canvas.Flush();

          using var image = surface.Snapshot();
          using var data = image.Encode(SKEncodedImageFormat.Png, 100);
          using var output = File.Create("avalonia-skia-font-probe.png");
          data.SaveTo(output);

          Console.WriteLine($"AVALONIA_SKIA_FONT_PROBE_OK bytes={data.Size} font={typeface.FamilyName}");

          public sealed class ProbeApp : Application
          {
              public static AppBuilder BuildAvaloniaApp() => AppBuilder.Configure<ProbeApp>()
                  .UseHarfBuzz()
                  .UseSkia()
                  .UseHeadless(new AvaloniaHeadlessPlatformOptions { UseHeadlessDrawing = false });
          }
          CS

      - name: Restore locked and validate local runtime
        shell: bash
        run: |
          set -euo pipefail
          test "$(dotnet --version)" = '10.0.301'
          dotnet --info > dotnet-info.txt
          dotnet restore probe/FoundryEnvironmentProbe.csproj --runtime win-x64 --use-lock-file --force-evaluate
          cp probe/packages.lock.json probe/packages.lock.generated.json
          dotnet restore probe/FoundryEnvironmentProbe.csproj --runtime win-x64 --locked-mode
          cmp probe/packages.lock.generated.json probe/packages.lock.json
          dotnet build probe/FoundryEnvironmentProbe.csproj -c Release --no-restore
          dotnet run --project probe/FoundryEnvironmentProbe.csproj -c Release --no-build
          test -s avalonia-skia-font-probe.png

      - name: Publish win-x64 self-contained
        shell: bash
        run: |
          set -euo pipefail
          dotnet publish probe/FoundryEnvironmentProbe.csproj -c Release -r win-x64 --self-contained true --locked-mode --no-restore -o publish-win-x64
          test -f publish-win-x64/FoundryEnvironmentProbe.exe
          test -f publish-win-x64/coreclr.dll
          test -f publish-win-x64/Avalonia.Base.dll
          find publish-win-x64 -type f -printf '%P\n' | LC_ALL=C sort > publish-win-x64-files.txt
          (cd publish-win-x64 && sha256sum $(find . -type f -printf '%P\n' | LC_ALL=C sort)) > publish-win-x64.sha256

      - name: Freeze cache evidence
        shell: bash
        run: |
          set -euo pipefail
          find nuget-cache -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > nuget-cache-files.sha256
          tar -czf foundry-nuget-cache-net10-avalonia12.1.0-win-x64.tar.gz nuget-cache
          sha256sum foundry-nuget-cache-net10-avalonia12.1.0-win-x64.tar.gz > foundry-nuget-cache-net10-avalonia12.1.0-win-x64.tar.gz.sha256
          tar -czf foundry-environment-probe-source.tar.gz global.json probe
          sha256sum foundry-environment-probe-source.tar.gz > foundry-environment-probe-source.tar.gz.sha256
          tar -czf foundry-environment-probe-publish-win-x64.tar.gz publish-win-x64
          sha256sum foundry-environment-probe-publish-win-x64.tar.gz > foundry-environment-probe-publish-win-x64.tar.gz.sha256

      - name: Upload cache and probe evidence
        uses: actions/upload-artifact@v4
        with:
          name: foundry-environment-cache-10.0.301-avalonia-12.1.0
          path: |
            foundry-nuget-cache-net10-avalonia12.1.0-win-x64.tar.gz
            foundry-nuget-cache-net10-avalonia12.1.0-win-x64.tar.gz.sha256
            foundry-environment-probe-source.tar.gz
            foundry-environment-probe-source.tar.gz.sha256
            foundry-environment-probe-publish-win-x64.tar.gz
            foundry-environment-probe-publish-win-x64.tar.gz.sha256
            nuget-cache-files.sha256
            publish-win-x64-files.txt
            publish-win-x64.sha256
            dotnet-info.txt
            avalonia-skia-font-probe.png
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
