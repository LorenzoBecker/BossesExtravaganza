name: Foundry Cache Transport Splitter

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  actions: read

jobs:
  split-qualified-cache:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Download cache from qualified run 30062678531
        uses: actions/download-artifact@v4
        with:
          name: Foundry-NuGet-Cache-net10-Avalonia12.1-win-x64-Parts
          path: cache
          run-id: 30062678531
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify qualified transfer parts
        shell: bash
        run: |
          set -Eeuo pipefail
          test -f cache/foundry-nuget-cache.tar.gz.part-00
          test -f cache/foundry-nuget-cache.tar.gz.part-01
          test -f cache/foundry-nuget-cache.tar.gz.part-02
          echo 'c7aa9168e45b05430c1c071676c3d09d9b15934ea510bb5f3753010cf4100c30  cache/foundry-nuget-cache.tar.gz.part-00' > EXPECTED_SHA256SUMS.txt
          echo '1c51cb9348bba1f6394f9557c0ecf036f035d54c083220f1581f512087994f98  cache/foundry-nuget-cache.tar.gz.part-01' >> EXPECTED_SHA256SUMS.txt
          echo '59ad55b65583e6ac3004bc47b3ab863b185d7f76b56057a5fd782040fbde3c82  cache/foundry-nuget-cache.tar.gz.part-02' >> EXPECTED_SHA256SUMS.txt
          sha256sum -c EXPECTED_SHA256SUMS.txt

      - name: Upload cache part 00
        uses: actions/upload-artifact@v4
        with:
          name: Foundry-NuGet-Cache-Part-00
          path: cache/foundry-nuget-cache.tar.gz.part-00
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Upload cache part 01
        uses: actions/upload-artifact@v4
        with:
          name: Foundry-NuGet-Cache-Part-01
          path: cache/foundry-nuget-cache.tar.gz.part-01
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Upload cache part 02
        uses: actions/upload-artifact@v4
        with:
          name: Foundry-NuGet-Cache-Part-02
          path: cache/foundry-nuget-cache.tar.gz.part-02
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
