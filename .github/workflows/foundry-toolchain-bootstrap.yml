name: Foundry Toolchain Bootstrap

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ foundry-toolchain-bootstrap-20260722 ]

permissions:
  contents: read

jobs:
  package-sdk:
    runs-on: ubuntu-latest
    steps:
      - name: Download exact Microsoft SDK
        shell: bash
        run: |
          set -euo pipefail
          url='https://builds.dotnet.microsoft.com/dotnet/Sdk/10.0.301/dotnet-sdk-10.0.301-linux-x64.tar.gz'
          curl --fail --location --retry 5 --retry-delay 3 "$url" --output dotnet-sdk-10.0.301-linux-x64.tar.gz
          printf '%s  %s\n' 'cfbeec3a3a1d3ad3e168e37a77c4cc26c23125acd84a86d014047da3ecffce4c368a9acac4d7c950a047fa3d98989ce8aea69f8e5842cb6d330e8911e1c335a7' 'dotnet-sdk-10.0.301-linux-x64.tar.gz' > dotnet-sdk-10.0.301-linux-x64.tar.gz.sha512
          sha512sum --check dotnet-sdk-10.0.301-linux-x64.tar.gz.sha512
          sha256sum dotnet-sdk-10.0.301-linux-x64.tar.gz > dotnet-sdk-10.0.301-linux-x64.tar.gz.sha256
          mkdir verify
          tar -xzf dotnet-sdk-10.0.301-linux-x64.tar.gz -C verify
          test "$(verify/dotnet --version)" = '10.0.301'
          verify/dotnet --info > dotnet-sdk-10.0.301-info.txt

      - name: Upload exact SDK archive
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-sdk-10.0.301-linux-x64
          path: |
            dotnet-sdk-10.0.301-linux-x64.tar.gz
            dotnet-sdk-10.0.301-linux-x64.tar.gz.sha512
            dotnet-sdk-10.0.301-linux-x64.tar.gz.sha256
            dotnet-sdk-10.0.301-info.txt
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
