name: Lab IV D3 PowerShell 5.1 ASCII Final

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parse-ascii-final:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - name: Recreate exact ASCII scripts and parse
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $installGzip = ''
          $rollbackGzip = ''

          function Expand-GzipBase64([string]$Encoded, [string]$Path) {
            $compressed = [Convert]::FromBase64String($Encoded)
            $input = New-Object IO.MemoryStream(,$compressed)
            $gzip = New-Object IO.Compression.GZipStream($input, [IO.Compression.CompressionMode]::Decompress)
            $output = New-Object IO.MemoryStream
            $gzip.CopyTo($output)
            $gzip.Dispose(); $input.Dispose()
            [IO.File]::WriteAllBytes($Path, $output.ToArray())
            $output.Dispose()
          }

          $installPath = "$env:RUNNER_TEMP\Install-EndlessExpanse-D3.ps1"
          $rollbackPath = "$env:RUNNER_TEMP\Rollback-EndlessExpanse-D2.ps1"
          Expand-GzipBase64 $installGzip $installPath
          Expand-GzipBase64 $rollbackGzip $rollbackPath

          $expected = @{
            $installPath = '0D6E5E8787FC974E9F7407161C9A3B0E9CBA122600C6262195224B322DBB2E1D'
            $rollbackPath = '028331AC588650F21663CB856344146E594343A99BEA109B4D3EAE2D1EFB3642'
          }
          $results = @()
          $totalErrors = 0
          foreach ($path in @($installPath, $rollbackPath)) {
            $tokens = $null; $errors = $null
            [void][Management.Automation.Language.Parser]::ParseFile($path, [ref]$tokens, [ref]$errors)
            $hash = (Get-FileHash $path -Algorithm SHA256).Hash
            $totalErrors += $errors.Count
            $results += [pscustomobject]@{ File=[IO.Path]::GetFileName($path); Sha256=$hash; HashMatches=($hash -eq $expected[$path]); TokenCount=$tokens.Count; ErrorCount=$errors.Count; Errors=@($errors | ForEach-Object { $_.Message }) }
          }
          $report = [pscustomobject]@{ PowerShellVersion=$PSVersionTable.PSVersion.ToString(); TotalErrors=$totalErrors; Results=$results }
          $report | ConvertTo-Json -Depth 6 | Set-Content "$env:RUNNER_TEMP\ps51-ascii-final.json" -Encoding UTF8
          if ($PSVersionTable.PSVersion.Major -ne 5 -or $PSVersionTable.PSVersion.Minor -ne 1) { throw 'Not Windows PowerShell 5.1' }
          if (@($results | Where-Object { -not $_.HashMatches }).Count -ne 0) { throw 'Hash mismatch' }
          if ($totalErrors -ne 0) { throw "Parser errors: $totalErrors" }
          Write-Host 'POWERSHELL_5_1_PARSE_PASS'

      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: LabIV-D3-PS51-ASCII-Final
          path: ${{ runner.temp }}\ps51-ascii-final.json
          if-no-files-found: error
          retention-days: 1
