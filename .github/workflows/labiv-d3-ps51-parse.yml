name: Lab IV D3 PowerShell 5.1 Parse

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parse-windows-powershell-51:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - name: Recreate exact scripts
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $install = ''
          $rollback = ''
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\Install-EndlessExpanse-D3.ps1", [Convert]::FromBase64String($install))
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\Rollback-EndlessExpanse-D2.ps1", [Convert]::FromBase64String($rollback))
          if ((Get-FileHash "$env:RUNNER_TEMP\Install-EndlessExpanse-D3.ps1" -Algorithm SHA256).Hash -ne '5E31C91A839411B2D9E2E2AACCF09B5D8479EE90E042CC16EB2A129C3C1EC59A') { throw 'Install hash mismatch' }
          if ((Get-FileHash "$env:RUNNER_TEMP\Rollback-EndlessExpanse-D2.ps1" -Algorithm SHA256).Hash -ne '015C5CB6EA7440AAF68CC1D44C815559D4946029D8E9F89A35F2D26F126090BC') { throw 'Rollback hash mismatch' }

      - name: Parse with Windows PowerShell 5.1
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if ($PSVersionTable.PSVersion.Major -ne 5 -or $PSVersionTable.PSVersion.Minor -ne 1) { throw "Unexpected PowerShell $($PSVersionTable.PSVersion)" }
          $results = @()
          foreach ($path in @("$env:RUNNER_TEMP\Install-EndlessExpanse-D3.ps1", "$env:RUNNER_TEMP\Rollback-EndlessExpanse-D2.ps1")) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($path, [ref]$tokens, [ref]$errors)
            if ($errors.Count -ne 0) { throw (($errors | ForEach-Object Message) -join '; ') }
            $results += [pscustomobject]@{ File = [IO.Path]::GetFileName($path); Tokens = $tokens.Count; Errors = $errors.Count; Sha256 = (Get-FileHash $path -Algorithm SHA256).Hash }
          }
          $results | Format-Table -AutoSize
          $results | ConvertTo-Json -Depth 4 | Set-Content "$env:RUNNER_TEMP\ps51-parse-results.json" -Encoding UTF8
          Write-Host 'POWERSHELL_5_1_PARSE_PASS'

      - name: Upload parse evidence
        uses: actions/upload-artifact@v4
        with:
          name: LabIV-D3-PS51-Parse-Evidence
          path: ${{ runner.temp }}\ps51-parse-results.json
          if-no-files-found: error
          retention-days: 1
